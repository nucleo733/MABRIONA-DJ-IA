<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Buscar música — MABRIONA</title>
<style>
  :root {
    --volt: #d4ff00;
    --bg: #0a0a0a;
    --bar: #131313;
    --border: rgba(255,255,255,0.1);
    --text: #f2f2f2;
    --text-dim: rgba(242,242,242,0.55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 52px;
    padding: 0 12px;
    background: var(--bar);
    border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
  }
  .toolbar button {
    -webkit-app-region: no-drag;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    font-size: 15px;
    cursor: pointer;
  }
  .toolbar button:hover { border-color: var(--volt); color: var(--volt); }
  .toolbar button:disabled { opacity: 0.3; cursor: default; }
  .addr-form { flex: 1; -webkit-app-region: no-drag; }
  .addr {
    width: 100%;
    height: 34px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #050505;
    color: var(--text);
    padding: 0 16px;
    font-size: 13px;
    outline: none;
  }
  .addr:focus { border-color: var(--volt); }
  .logo { -webkit-app-region: no-drag; color: var(--text-dim); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; white-space: nowrap; }
  .logo b { color: var(--volt); }
  webview { width: 100%; height: calc(100% - 52px); background: #000; }
</style>
</head>
<body>
  <div class="toolbar">
    <button id="back" title="Atrás">←</button>
    <button id="fwd" title="Adelante">→</button>
    <button id="reload" title="Recargar">⟳</button>
    <form class="addr-form" id="addr-form">
      <input class="addr" id="addr" spellcheck="false" />
    </form>
    <span class="logo">MABRIONA <b>SEARCH</b></span>
  </div>
  <webview id="view" src="https://search.brave.com" allowpopups></webview>

  <script>
    const view = document.getElementById('view')
    const addr = document.getElementById('addr')
    const form = document.getElementById('addr-form')
    const backBtn = document.getElementById('back')
    const fwdBtn = document.getElementById('fwd')
    const reloadBtn = document.getElementById('reload')

    function normalize(input) {
      const trimmed = input.trim()
      if (!trimmed) return 'https://search.brave.com'
      const looksLikeUrl = /^https?:\/\//i.test(trimmed) || /^[\w-]+(\.[\w-]+)+(\/.*)?$/i.test(trimmed)
      if (looksLikeUrl) return /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`
      // Brave como motor de búsqueda predeterminado de este panel — antes buscaba directo en
      // youtube.com, ahora busca con Brave (a pedido explícito). Un video real de YouTube sigue
      // siendo un resultado normal ahí adentro, un clic lo abre en el mismo webview.
      return `https://search.brave.com/search?q=${encodeURIComponent(trimmed)}`
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault()
      view.src = normalize(addr.value)
    })

    view.addEventListener('did-navigate', () => {
      addr.value = view.getURL()
      backBtn.disabled = !view.canGoBack()
      fwdBtn.disabled = !view.canGoForward()
    })
    view.addEventListener('did-navigate-in-page', () => {
      addr.value = view.getURL()
    })

    backBtn.addEventListener('click', () => view.goBack())
    fwdBtn.addEventListener('click', () => view.goForward())
    reloadBtn.addEventListener('click', () => view.reload())
  </script>
</body>
</html>
